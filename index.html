<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Notizen</title>
<meta name="description" content="Notizen, Aufgaben und Dailies – lokal auf deinem Gerät.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta id="theme-color" name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notizen">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" type="image/png">

<link rel="stylesheet" href="./style.css">

<script>
  // Theme vor dem ersten Paint setzen – verhindert das weiße Aufblitzen.
  (function () {
    try {
      var saved = localStorage.getItem('notizen-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
</head>

<body>
<div class="app">

  <header class="topbar">
    <h2 class="topbar__title">Heute</h2>

    <div class="themetoggle" role="group" aria-label="Erscheinungsbild">
      <span class="themetoggle__thumb" aria-hidden="true"></span>
      <button data-theme="light" aria-pressed="true" aria-label="Helles Design">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button data-theme="dark" aria-pressed="false" aria-label="Dunkles Design">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6.4 6.4 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="view is-active" id="view-today" aria-label="Heute"></section>
    <section class="view" id="view-tasks" aria-label="Aufgaben"></section>
    <section class="view" id="view-notes" aria-label="Notizen"></section>
    <section class="view" id="view-more" aria-label="Mehr"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Bereiche">
    <button data-view="today" role="tab" aria-selected="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3m8-3v3"/><circle cx="12" cy="14.5" r="1.6" fill="currentColor" stroke="none"/></svg>
      Heute
    </button>
    <button data-view="tasks" role="tab" aria-selected="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6.5 2 2 3.5-3.5M3 16.5l2 2 3.5-3.5M12 7h9M12 17h9"/></svg>
      Aufgaben
    </button>
    <button data-view="notes" role="tab" aria-selected="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h9.5L19 8v12.5H5z"/><path d="M14 3.5V8h5M8.5 12.5h7M8.5 16h4.5"/></svg>
      Notizen
    </button>
    <button data-view="more" role="tab" aria-selected="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="20" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      Mehr
    </button>
  </nav>

</div>

<!-- Notiz-Editor -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Notiz bearbeiten">
  <div class="sheet__bar">
    <button id="editor-close">Fertig</button>
    <span class="sheet__status" id="editor-status"></span>
    <button class="textbtn textbtn--danger" id="editor-delete">Löschen</button>
  </div>
  <div class="sheet__body">
    <input class="sheet__title" id="editor-title" type="text" placeholder="Titel" autocomplete="off">
    <textarea class="sheet__text" id="editor-text" placeholder="Schreib los…" spellcheck="true"></textarea>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" class="sr">

<script src="./app.js"></script>
</body>
</html>
